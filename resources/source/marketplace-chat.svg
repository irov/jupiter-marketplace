<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080C1C"/><stop offset="1" stop-color="#15112D"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A98DFF"/><stop offset="1" stop-color="#56D9FF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/></filter>
    <clipPath id="frame"><rect width="1200" height="560" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <circle cx="1040" cy="110" r="230" fill="#7048D8" opacity="0.10"/>
    <circle cx="370" cy="590" r="310" fill="#1769C8" opacity="0.08"/>
    <rect width="1200" height="560" fill="none" stroke="#2D315B" stroke-width="2"/>
  </g>

  <g font-family="SF Pro Display, Inter, Arial, sans-serif">
    <g transform="translate(58 54)">
      <rect width="147" height="31" rx="15.5" fill="#211C40" stroke="#4D417C"/>
      <text x="18" y="21" fill="#BBA8FF" font-size="12" font-weight="750" letter-spacing="1.3">TASK-AWARE AI</text>
    </g>
    <text x="58" y="145" fill="#F7FAFF" font-size="46" font-weight="760" letter-spacing="-1.2">Your AI starts</text>
    <text x="58" y="200" fill="url(#accent)" font-size="46" font-weight="760" letter-spacing="-1.2">in the right place.</text>
    <text x="58" y="257" fill="#B9C6DD" font-size="19">No pasted ticket. No guessed branch.</text>
    <text x="58" y="286" fill="#B9C6DD" font-size="19">Jupiter attaches the task, repository,</text>
    <text x="58" y="315" fill="#B9C6DD" font-size="19">worktree, and safety boundaries.</text>

    <g transform="translate(58 379)" font-size="13">
      <rect width="342" height="120" rx="14" fill="#0F172B" stroke="#2E3C62"/>
      <text x="18" y="27" fill="#8A9CBA" font-size="11" font-weight="750" letter-spacing="1.1">CONTEXT ATTACHED</text>
      <g transform="translate(18 43)" fill="#D9E3F2" font-weight="620">
        <circle cx="7" cy="7" r="7" fill="#203A58"/><path d="M4 7l2 2 4-5" fill="none" stroke="#63DAFF" stroke-width="1.5"/><text x="22" y="11">Task and source details</text>
        <g transform="translate(0 28)"><circle cx="7" cy="7" r="7" fill="#203A58"/><path d="M4 7l2 2 4-5" fill="none" stroke="#63DAFF" stroke-width="1.5"/><text x="22" y="11">Required branch and worktree</text></g>
        <g transform="translate(0 56)"><circle cx="7" cy="7" r="7" fill="#203A58"/><path d="M4 7l2 2 4-5" fill="none" stroke="#63DAFF" stroke-width="1.5"/><text x="22" y="11">Repository instructions and MCP</text></g>
      </g>
    </g>

    <g transform="translate(455 42)" filter="url(#shadow)">
      <rect width="687" height="476" rx="22" fill="#0A1020" stroke="#31365E"/>
      <rect width="687" height="55" rx="22" fill="#12172B"/>
      <rect y="33" width="687" height="22" fill="#12172B"/>
      <circle cx="24" cy="28" r="5" fill="#FF6F6F"/><circle cx="42" cy="28" r="5" fill="#FFD166"/><circle cx="60" cy="28" r="5" fill="#66E39A"/>
      <circle cx="99" cy="27" r="14" fill="#231D47" stroke="#6250A0"/>
      <path d="M99 19l2.3 5.4 5.7 2.3-5.7 2.3-2.3 5.4-2.3-5.4-5.7-2.3 5.7-2.3z" fill="#B69CFF"/>
      <text x="123" y="33" fill="#E5EAF6" font-size="14" font-weight="700">Jupiter Agent · GH-248</text>
      <rect x="557" y="16" width="105" height="24" rx="12" fill="#173A2C"/><circle cx="572" cy="28" r="4" fill="#66E39A"/><text x="583" y="32" fill="#8CEAB3" font-size="10" font-weight="750">WORKTREE OK</text>

      <g transform="translate(24 80)">
        <rect x="133" width="506" height="82" rx="15" fill="#18243A"/>
        <text x="151" y="27" fill="#DCE5F4" font-size="13" font-weight="620">Review the refresh path and remove duplicate Git work.</text>
        <text x="151" y="52" fill="#899BB8" font-size="11">Keep the change scoped to this task and preserve existing behavior.</text>
        <text x="590" y="69" fill="#687B9B" font-size="10">YOU</text>
      </g>

      <g transform="translate(24 181)">
        <circle cx="24" cy="24" r="20" fill="#251F4A" stroke="#6252A3"/>
        <path d="M24 15l2.3 5.8 5.7 2.2-5.7 2.3-2.3 5.7-2.3-5.7-5.7-2.3 5.7-2.2z" fill="#BCA6FF"/>
        <rect x="58" width="581" height="156" rx="15" fill="#10192D" stroke="#303B61"/>
        <text x="78" y="30" fill="#F0F4FB" font-size="13" font-weight="670">Ready in the exact Jupiter task context.</text>
        <g transform="translate(78 50)" font-family="SF Mono, Menlo, monospace" font-size="11">
          <text y="0" fill="#79DFFF">TASK</text><text x="74" fill="#C9D4E6">GH-248 · Prevent duplicate task refreshes</text>
          <text y="24" fill="#79DFFF">BRANCH</text><text x="74" y="24" fill="#C9D4E6">feature/GH-248-dedupe-task-refreshes</text>
          <text y="48" fill="#79DFFF">WORKTREE</text><text x="74" y="48" fill="#C9D4E6">.jupiter/workspaces/GH-248</text>
          <text y="72" fill="#79DFFF">GUARD</text><text x="74" y="72" fill="#C9D4E6">verify branch before edits or Git actions</text>
        </g>
        <text x="78" y="139" fill="#8597B5" font-size="11">I’ll trace the first expensive refresh before changing code.</text>
      </g>

      <g transform="translate(24 371)">
        <rect width="639" height="62" rx="14" fill="#0D1528" stroke="#263858"/>
        <text x="18" y="27" fill="#7184A4" font-size="12">Ask Jupiter Agent about this task…</text>
        <rect x="571" y="11" width="50" height="40" rx="10" fill="#664FE0"/>
        <path d="M588 31h15m-6-6l6 6-6 6" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="48" fill="#566B8C" font-size="10">Task context stays attached for the whole conversation</text>
      </g>
    </g>
  </g>
</svg>
